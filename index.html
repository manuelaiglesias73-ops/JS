<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/datos.js"></script>
    <script src="./js/main.js"></script>
</head>
<body>
    <div class="container">
        <h1>Gestión de Clientes</h1>
        <form id="formCliente">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="telefono" placeholder="Teléfono" required>
            <button type="submit" id="btnSubmit">Agregar Cliente</button>
        </form>

        <div id="listaClientes" class="grid-clientes"></div>
    </div>

    <div id="modalEdicion" class="modal">
        <div class="modal-content">
            <h2>Editar Cliente</h2>
            <input type="hidden" id="editId">
            <input type="text" id="editNombre" placeholder="Nombre">
            <input type="text" id="editApellido" placeholder="Apellido">
            <input type="text" id="editTelefono" placeholder="Teléfono">
            <div class="acciones">
                <button onclick="guardarEdicion()" class="btn-editar">Guardar</button>
                <button onclick="cerrarModal()" class="btn-borrar">Cancelar</button>
            </div>
        </div>
        
    </div>
    <div class="filtros">
           <input type="text" id="inputBusqueda" placeholder="Buscar por apellido...">
           <button id="btnBuscar" class="btn-editar">Buscar</button>
           <button id="btnLimpiar" class="btn-borrar">Ver Todos</button>
     </div>
</body>
</html>
